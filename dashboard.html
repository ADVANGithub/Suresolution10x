<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | SureSolutions10X</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
}

header{

background:#0f172a;
color:#fff;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;

}

header h2{

font-size:24px;

}

.logout{

background:#ef4444;
color:#fff;
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;

}

.container{

max-width:1200px;
margin:auto;
padding:40px 20px;

}

.welcome{

background:white;
padding:30px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
margin-top:30px;

}

.card{

background:white;
padding:25px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.card h3{

margin-bottom:12px;

}

.card p{

color:#555;
margin-bottom:20px;

}

.btn{

display:inline-block;
background:#2563eb;
color:white;
padding:12px 20px;
border-radius:8px;
text-decoration:none;

}

</style>

</head>

<body>

<header>

<h2>SureSolutions10X</h2>

<button class="logout" onclick="logout()">

Logout

</button>

</header>

<div class="container">

<div class="welcome">

<h1 id="username">

Welcome 👋

</h1>

<p>

Continue your learning journey.

</p>

</div>

<div class="grid">

<div class="card">

<h3>Master AI From Scratch</h3>

<p>

Complete AI course with videos, notes and projects.

</p>

<a href="course.html" class="btn">

Continue Learning

</a>

</div>

<div class="card">

<h3>Resources</h3>

<p>

PDF Notes, Cheat Sheets and Source Files.

</p>

<a href="#" class="btn">

Download

</a>

</div>

</div>

</div>

<script>

const token=localStorage.getItem("token");

if(!token){

window.location="login.html";

}

async function loadDashboard(){

try{

const response=await fetch("/api/me",{

headers:{

Authorization:`Bearer ${token}`

}

});

if(response.status===401){

localStorage.clear();

window.location="login.html";

return;

}

const data=await response.json();

document.getElementById("username").innerHTML=`Welcome ${data.name} 👋`;

}catch(e){

alert("Unable to load dashboard.");

}

}

function logout(){

localStorage.clear();

window.location="login.html";

}

loadDashboard();

</script>

</body>
</html>
